name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: legal_draft_db
          POSTGRES_USER: legaluser
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legaluser -d legal_draft_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: testpass
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli -a testpass ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: legal_draft_db
      POSTGRES_USER: legaluser
      POSTGRES_PASSWORD: testpass
      REDIS_HOST: localhost
      REDIS_PASSWORD: testpass
      SECRET_KEY: test-secret-key-for-ci
      GROQ_API_KEY: dummy
      GROQ_MODEL: openai/gpt-oss-20b
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Wait for services
        run: |
          sleep 10
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install lint tools
        run: |
          cd backend
          pip install ruff mypy
      - name: Run ruff
        run: |
          cd backend
          ruff check .
      - name: Run mypy
        run: |
          cd backend
          mypy --ignore-missing-imports .

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, backend-lint, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: legal-draft-backend:test
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: legal-draft-frontend:test
      - name: Verify images run
        run: |
          docker run --rm legal-draft-backend:test python -c "import main; print('backend imports OK')"
          docker run --rm legal-draft-frontend:test ls /app/dist