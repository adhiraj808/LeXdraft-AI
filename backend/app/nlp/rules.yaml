# ============ GLOBAL SETTINGS ============
global:
  # Entity types that must be grounded in FactSheet
  grounded_entity_types:
    - "name"
    - "date"
    - "amount"
    - "address"
    - "clause"

  # Review notes to always include
  review_notes:
    parties: "Exact legal names and entity types to be confirmed."
    roles: "Party roles assumed from the prompt; confirm which party you represent."
    statutes: "Section 73 applies to damages only; specific performance is under SRA ss.10/14/16."

  # Critical fields that must be present (5 questions)
  critical_fields:
    - "parties"
    - "claim_type"
    - "relief_sought"
    - "user_side"
    - "jurisdiction"