# Legal Draft System - Validation Rules
# Rules are keyed by claim_type and define validation constraints
# This file replaces hardcoded rules in validator.py

rules:
  # ============ CONTRACT CLAIMS ============
  breach_of_contract:
    statutes_whitelist:
      - "Section 73 of the Indian Contract Act 1872"
      - "Section 74 of the Indian Contract Act 1872"
      - "Section 55 of the Indian Contract Act 1872"
      - "Specific Relief Act 1963"
      - "Sale of Goods Act 1930"
    invalid_combinations:
      - description: "Section 73 applies to damages only, not specific performance"
        pattern: "specific performance.*Section 73"
        message: "Draft cites 'specific performance under Section 73' — Section 73 applies to damages only. Specific performance is under Specific Relief Act ss.10/14/16."
      - description: "Contract value should not equal damages claimed"
        check: "contract_value_equals_damages"
        message: "Contract value and damages claimed are identical — verify these are distinct amounts."
    required_fields:
      - "contract_date"
      - "contract_value"
      - "parties"
    relief_types:
      - "damages"
      - "specific_performance"
      - "injunction"
      - "declaration"

  recovery_of_money:
    statutes_whitelist:
      - "Section 73 of the Indian Contract Act 1872"
      - "Section 74 of the Indian Contract Act 1872"
      - "Order 37 CPC (Summary Procedure)"
      - "Negotiable Instruments Act 1881"
      - "SARFAESI Act 2002"
    invalid_combinations:
      - description: "Section 73 applies to damages only"
        pattern: "specific performance.*Section 73"
        message: "Section 73 applies to damages only; specific performance is under SRA ss.10/14/16."
    required_fields:
      - "contract_value"
      - "parties"
    relief_types:
      - "recovery"
      - "interest"
      - "costs"

  non_delivery_of_goods:
    statutes_whitelist:
      - "Section 73 of the Indian Contract Act 1872"
      - "Section 74 of the Indian Contract Act 1872"
      - "Section 55 of the Indian Contract Act 1872"
      - "Specific Relief Act 1963"
      - "Sale of Goods Act 1930"
    invalid_combinations:
      - description: "Section 73 applies to damages only, not specific performance"
        pattern: "specific performance.*Section 73"
        message: "Draft cites 'specific performance under Section 73' — Section 73 applies to damages only. Specific performance is under Specific Relief Act ss.10/14/16."
      - description: "Contract value should not equal damages claimed"
        check: "contract_value_equals_damages"
        message: "Contract value and damages claimed are identical — verify these are distinct amounts."
    required_fields:
      - "contract_date"
      - "contract_value"
      - "parties"
    relief_types:
      - "damages"
      - "specific_performance"
      - "injunction"
      - "declaration"

  specific_performance:
    statutes_whitelist:
      - "Specific Relief Act 1963"
      - "Section 10 Specific Relief Act"
      - "Section 14 Specific Relief Act"
      - "Section 16 Specific Relief Act"
    invalid_combinations:
      - description: "Section 73 cannot be cited for specific performance"
        pattern: "Section 73.*specific performance|specific performance.*Section 73"
        message: "Section 73 applies to damages only; specific performance is under Specific Relief Act ss.10/14/16."
    required_fields:
      - "contract_date"
      - "parties"
    relief_types:
      - "specific_performance"
      - "declaration"
      - "injunction"

  # ============ CHEQUE BOUNCE ============
  cheque_bounce:
    statutes_whitelist:
      - "Section 138 Negotiable Instruments Act 1881"
      - "Section 139 Negotiable Instruments Act 1881"
      - "Section 140 Negotiable Instruments Act 1881"
      - "Section 141 Negotiable Instruments Act 1881"
      - "Section 142 Negotiable Instruments Act 1881"
      - "Section 143 Negotiable Instruments Act 1881"
      - "Section 144 Negotiable Instruments Act 1881"
      - "Section 145 Negotiable Instruments Act 1881"
      - "Section 146 Negotiable Instruments Act 1881"
      - "Section 147 Negotiable Instruments Act 1881"
      - "Section 148 Negotiable Instruments Act 1881"
    invalid_combinations: []
    required_fields:
      - "cheque_amount"
      - "cheque_date"
      - "dishonour_date"
      - "notice_date"
      - "parties"
    relief_types:
      - "prosecution"
      - "compensation"
      - "interim_compensation"

