# Ruff config for the Legal Draft System backend.
#
# The codebase was written before Ruff was wired into CI, so enforcing every
# default rule fails with 338 errors (mostly UP006/UP045 type-annotation
# nits the project has not adopted yet). This config keeps Ruff useful:
# it fails on the real correctness problems (F, B, S, E) while the purely
# stylistic UP/I/RET/BLE rules are ignored until they are fixed.

target-version = "py311"
line-length = 120

[lint]
select = [
  "F",      # pyflakes (undefined names, unused imports, unused vars)
  "E",      # pycodestyle errors
  "B",      # flake8-bugbear (mutable defaults, suspicious patterns)
  "S",      # bandit-inspired security checks
  "UP006",  # non-PEP585-annotation
  "UP045",  # non-PEP604-annotation-optional
  "UP035",  # deprecated-import
  "UP017",  # datetime-timezone-utc
  "UP037",  # quoted-annotation
  "UP041",  # timeout-error-alias
  "I001",   # unsorted-imports
  "RUF100", # unused-noqa
  "RUF013", # implicit-optional
  "RUF012", # mutable-class-default
  "BLE001", # blind-except
  "RET501", # unnecessary-return-none
  "PLR1711",# useless-return
  "S110",   # try-except-pass
  "S112",   # try-except-continue
]
ignore = [
  # Legacy style: the project targets Python 3.11 and has not migrated to
  # PEP585/PEP604 annotations repo-wide. Keep these ignored until migrated.
  "UP006",
  "UP045",
  "UP035",
  "UP017",
  "UP037",
  "UP041",
  "RUF013",
  "RUF012",
  "BLE001",
  "S110",
  "S112",
  "B008",   # function-call-in-default-argument - intentional in several places
  "I001",   # import sorting - enforced manually for now
  "E501",   # line-too-long - cosmetic, large existing code base
  "S101",   # assert - allowed in tests
  "S105",   # hardcoded-password-string - test fixtures only
  "S106",   # hardcoded-password-func-arg - test fixtures only
  "S104",   # hardcoded-bind-all-interfaces - intentional (FastAPI host)
  "B904",   # raise-without-from-inside-except - cosmetic, legacy code
  "E701",   # multiple-statements-on-one-line-colon - cosmetic
  "E702",   # multiple-statements-on-one-line-semicolon - cosmetic
  "B905",   # zip-without-explicit-strict - cosmetic
]
