  # `location` blocks are not allowed at the http level: a bare
  # `location ~* ...` in cache.conf made nginx fail to start entirely.
  # Kept inside the server block instead. gzip + hardening headers too.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;
  gzip_disable "MSIE [1-6]\.";
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Do NOT set "proxy_set_header Host $host" here: the browser's Host
        # (e.g. a LAN IP or a public domain) would fail the backend's
        # HostGuardMiddleware. Without the override nginx sends the configured
        # upstream name ("backend"), which is in ALLOWED_HOSTS by default.
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Draft regeneration and SSE progress can run for minutes.
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 1m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
  }